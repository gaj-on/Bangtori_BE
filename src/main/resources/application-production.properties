spring.application.name=Bangtori_BE

# src/main/resources/application-production.properties
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
server.port=${SERVER_PORT:8080}

# CORS allowed origins domains (will be added later when the frontend is ready)
# When the FE is ready, CorsConfig will also be added to use this property
# app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend.example-blabla}

# FastAPI
#ai.base-url=${AI_BASE_URL:https://fastapi.internal}

# Device Key
#security.device-keys=${DEVICE_KEYS}

# AI Callback Secret (for FastAPI)
#ai.callback.secret=${AI_CALLBACK_SECRET}


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
